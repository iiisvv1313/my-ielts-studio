window.startStudio=()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const KEY='ielts-studio-v2-20261126';const categories=["听力同义替换", "听力原文单词", "题目生词", "选项生词", "听力错词", "填空生词", "听力待分类", "阅读文章名", "阅读小标题", "阅读选项生词", "阅读生词", "阅读同义替换", "538 · 考点词义", "538 · 同义替换", "538 · 替换词义"];const intervals=[1,2,4,7,14,30];const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function addDays(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');const syn=w=>w.cat.endsWith('同义替换');const kind=w=>syn(w)?'syn':w.cat==='听力错词'?'spell':(w.cat.startsWith('阅读')||w.cat.startsWith('538'))?'read':'listen';let seed=[['monument','纪念碑','听力错词','C16-T4-S1'],['wood','木材；木头','听力错词','C16-T4-S1'],['deposit','押金','填空生词','C16-T4-S1'],['stove','炉子','填空生词','C16-T4-S1'],['fragile','易碎的','选项生词','C16-T2-S1'],['frame','框架','填空生词','C16-T2-S1'],['cosy','舒适的','听力原文单词','C16-T4-S1'],['convert','转换；改造','听力原文单词','C16-T4-S1'],['patio','露台','听力原文单词','C16-T4-S1'],['available','free','听力同义替换','C16-T4-S1'],['final payment','the rest of the money','听力同义替换','C16-T4-S1'],['spaces','room','听力同义替换','C16-T4-S1'],['significance','importance','阅读同义替换',''],['hindsight','后见之明','阅读生词',''],['extract','提取；抽取','阅读生词',''],['vivid','生动的','阅读生词','']];function make(a,i){return {id:'s'+i,word:a[0],answer:a[1],cat:a[2],source:a[3]||'',memo:'',errors:0,attempts:0,streak:0,stage:-1,due:'',active:false,passed:'',last:'',history:[]}}const imported=window.__studioWords;let db={words:imported,daily:{},speed:.9};let storage=true;try{let old=window.__studioPayload?JSON.stringify(window.__studioPayload):null;if(old){let p=JSON.parse(old);if(Array.isArray(p.words)){let oldWords=p.words;le function cleanZh(v){return String(v??'').normalize('NFKC').replace(/\b(?:adj|adv|n|v|vt|vi|prep|pron|conj|phr|pl)\.\s*/gi,'').replace(/[（(][^）)]*[）)]/g,'').replace(/\s+/g,'').replace(/^[的地得]+|[。！!？?]+$/g,'').trim()}

function stats(){ $('#today').textContent=db.daily[day()]?.attempts||0;$('#wrong').textContent=db.words.filter(w=>w.errors>0||w.cat==='听力错词').length;$('#due').textContent=db.words.filter(w=>due(w)).length;};function due(w,mode=readMode()){let p=progress(w,mode);return p.active||!!p.due&&p.due<=day()};const tabs=['今日复习','分类训练','错词本','我的词库','设置与备份','538 专项'];let tab=0,session=null;function nav(){ $('#nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(session&&!session.finished&&!confirm('退出本轮？已经答过的题会保存。'))return;session=null;tab=+b.dataset.tab;render()})};function render(){stats();nav();if(session){question();return}if(tab===0)home();if(tab===1)training();if(tab===2)wrongPage();if(tab===3)library();if(tab===4)settings();if(tab===5)training538()};const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function panel(s){$('#view').innerHTML='<div class="panel">'+s+'</div>'};function achievement(){let d=day(),a=db.daily[d]||{},c=db.study||{newCount:60,ratio:3},n=a.newCount||0,v=a.reviewCount||0,ok=a.correct||0,bad=a.wrong||0,rate=ok+bad?Math.round(ok*1000/(ok+bad))/10:0;let active=x=>!!((db.daily[x]?.attempts||0)+(db.daily[x]?.matchCorrect||0)+(db.daily[x]?.matchWrong||0));let streak=0,i=active(d)?0:1;while(active(addDays(-i))){streak++;i++}let card=(label,value,target,color)=>'<div style="border:1px solid #8883;border-radius:12px;padding:12px;min-width:0"><small>'+label+'</small><div style="font-size:26px;font-weight:700;color:'+color+'">'+value+(target!=null?'<small style="font-size:12px;color:inherit"> / '+target+'</small>':'')+'</div>'+(target!=null?'<div class="bar"><div style="width:'+Math.min(100,target?100*value/target:100)+'%;background:'+color+'"></div></div>':'')+'</div>';let days=Array.from({length:7},(_,i)=>addDays(i-6)),max=Math.max(1,...days.map(x=>db.dai function getPlan(cfg,scope,reset=false){db.plans??={};let key=planKey(cfg),p=db.plans[key];if(!p||reset){let list=scope.filter(w=>matches(w,cfg.range));let keys=units(list);if(cfg.order==='random')keys=shuffle(keys);let groups=new Map();for(let w of list){let u=unit(w);if(!groups.has(u))groups.set(u,[]);groups.get(u).push(w.id)}p=db.plans[key]={remaining:keys.flatMap(u=>groups.get(u)),batch:[],round:0,initial:keys.length};}if(cfg.range!=='all'){let existing=new Set(p.remaining);for(let w of scope){if(matches(w,cfg.range)&&!existing.has(w.id)){p.remaining.push(w.id);existing.add(w.id)}}}return {key,p}}

function beginPlan(cfg,scope,reset=false){db.readMode=cfg.readMode==='recall'?'recall':'choice';let {key,p}=getPlan(cfg,scope,reset);let remaining=planRemaining(p,cfg,scope);if(!remaining.length){session=null;save();render();return}let oldBatch=new Set(p.batch??[]);let list=remaining.filter(w=>oldBatch.has(w.id));if(!list.length){let keys=new Set(cfg.limit?units(remaining).slice(0,cfg.limit):units(remaining));list=remaining.filter(w=>keys.has(unit(w)));p.batch=list.map(w=>w.id)}save();start(list,cfg.order==='ordered',{key,cfg,scopeIds:scope.map(w=>w.id),round:p.round+1});}

 const terms=s=>String(s??'').replace(/(?:\b(?:adj|adv|n|v|vt|vi|prep|pron|conj)\.\s*)/gi,'').split(/[；;，,、／/。]/).map(t=>norm(t)).filter(Boolean);
 const known=bank.filter(x=>norm(x.word)===norm(w.word)&&syn(x)===isSyn);
 const forbidden=new Set([correct,...known.map(x=>norm(x.answer))]);
 if(isSyn&&w.group)for(const x of bank)if(x.group===w.group&&syn(x))forbidden.add(norm(x.answer));
 const meanings=new Set([w,...known].flatMap(x=>terms(x.answer)));
 const same=[],rest=[],seen=new Set();
 for(const x of bank){
  if(syn(x)!==isSyn||(!isSyn&&kind(x)!=='read')||norm(x.word)===norm(w.word))continue;
  const value=String(x.answer??'').trim(), n=norm(value);
  if(!n||forbidden.has(n)||seen.has(n)||(!isSyn&&(!/[\u3400-\u9fff]/.test(value)||terms(value).some(t=>meanings.has(t)))))continue;
  seen.add(n);(x.cat===w.cat?same:rest).push(value);
 }
 const pool=[...shuffle(same),...shuffle(rest)];
 const fresh=pool.filter(v=>!prior?.wrong.includes(norm(v)));
 const reused=pool.filter(v=>prior?.wrong.includes(norm(v)));
 const wrong=[...fresh,...reused].slice(0,3);
 const options=shuffle([w.answer,...wrong]);
 if(prior&&options.length>1&&options.indexOf(w.answer)===prior.index){
  const i=prior.index,j=(i+1+Math.floor(Math.random()*(options.length-1)))%options.length;
  [options[i],options[j]]=[options[j],options[i]];

}
