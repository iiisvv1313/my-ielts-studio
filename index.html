window.startStudio=()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const KEY='ielts-studio-v2-20261126';const categories=["听力同义替换", "听力原文单词", "题目生词", "选项生词", "听力错词", "填空生词", "听力待分类", "阅读文章名", "阅读小标题", "阅读选项生词", "阅读生词", "阅读同义替换", "538 · 考点词义", "538 · 同义替换", "538 · 替换词义"];const intervals=[1,2,4,7,16];const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function addDays(n){let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const norm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');const syn=w=>w.cat.endsWith('同义替换');const kind=w=>syn(w)?'syn':w.cat==='听力错词'?'spell':(w.cat.startsWith('阅读')||w.cat.startsWith('538'))?'read':'listen';let seed=[['monument','纪念碑','听力错词','C16-T4-S1'],['wood','木材；木头','听力错词','C16-T4-S1'],['deposit','押金','填空生词','C16-T4-S1'],['stove','炉子','填空生词','C16-T4-S1'],['fragile','易碎的','选项生词','C16-T2-S1'],['frame','框架','填空生词','C16-T2-S1'],['cosy','舒适的','听力原文单词','C16-T4-S1'],['convert','转换；改造','听力原文单词','C16-T4-S1'],['patio','露台','听力原文单词','C16-T4-S1'],['available','free','听力同义替换','C16-T4-S1'],['final payment','the rest of the money','听力同义替换','C16-T4-S1'],['spaces','room','听力同义替换','C16-T4-S1'],['significance','importance','阅读同义替换',''],['hindsight','后见之明','阅读生词',''],['extract','提取；抽取','阅读生词',''],['vivid','生动的','阅读生词','']];function make(a,i){return {id:'s'+i,word:a[0],answer:a[1],cat:a[2],source:a[3]||'',memo:'',errors:0,attempts:0,streak:0,stage:-1,due:'',active:false,passed:'',last:'',history:[]}}const imported=window.__studioWords;let db={words:imported,daily:{},speed:.9};let storage=true;try{let old=window.__studioPayload?JSON.stringify(window.__studioPayload):null;if(old){let p=JSON.parse(old);if(Array.isArray(p.words)){let oldWords=p.words;let map=new Map(oldWords.map(w=>[w.id,w]));db={...p,words:imported.map(w=>{let a=map.get(w.id)||oldWords.find(x=>norm(x.word)===norm(w.word)&&x.cat===w.cat&&norm(x.answer)===norm(w.answer));return a?{...w,...Object.fromEntries(["errors","attempts","streak","stage","due","active","passed","last","history"].map(k=>[k,a[k]??w[k]]))}:w})};db.words.push(...oldWords.filter(w=>w.id.startsWith("u")&&!db.words.some(x=>x.id===w.id)))}}}catch(e){storage=false}function save(){try{window.__studioSave(db)}catch(e){storage=false}stats()};function stats(){ $('#today').textContent=db.daily[day()]?.attempts||0;$('#wrong').textContent=db.words.filter(w=>w.errors>0||w.cat==='听力错词').length;$('#due').textContent=db.words.filter(due).length;};function due(w){return w.active||!!w.due&&w.due<=day()};const tabs=['今日复习','分类训练','错词本','我的词库','设置与备份','538 专项'];let tab=0,session=null;function nav(){ $('#nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(session&&!session.finished&&!confirm('退出本轮？已经答过的题会保存。'))return;session=null;tab=+b.dataset.tab;render()})};function render(){stats();nav();if(session){question();return}if(tab===0)home();if(tab===1)training();if(tab===2)wrongPage();if(tab===3)library();if(tab===4)settings();if(tab===5)training538()};const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function panel(s){$('#view').innerHTML='<div class="panel">'+s+'</div>'};function home(){let list=db.words.filter(due),active=list.filter(w=>w.active).length;panel(`<h2>今日复习 · ${day()}</h2><p>待复习 ${list.length} 个，其中 ${active} 个尚未过关。</p><p class="note">错词当天独立正确 3 次；每次间隔至少 3 道其他词汇。过关后按第 1、3、7、14、30 天安排复习。历史错误次数不会清零。</p><div class="actions"><button class="primary" id="start" ${list.length?'':'disabled'}>开始今日复习</button><button id="fresh">练习正式词库 / 新词</button></div>${storage?'':'<p class="danger">当前浏览器无法保存数 const mastered=w=>!!w.passed&&!w.active;
const unit=w=>w.cat.startsWith('538')&&w.group?w.group:w.id;
const units=a=>[...new Set(a.map(unit))];
const lookup=ids=>{let m=new Map(db.words.map(w=>[w.id,w]));return ids.map(id=>m.get(id)).filter(Boolean)};

function planKey(cfg){return JSON.stringify([cfg.screen,cfg.cat,cfg.src,cfg.range,cfg.order])}
function getPlan(cfg,scope,reset=false){db.plans??={};let key=planKey(cfg),p=db.plans[key];if(!p||reset){let list=scope.filter(w=>matches(w,cfg.range));let keys=units(list);if(cfg.order==='random')keys=shuffle(keys);let groups=new Map();for(let w of list){let u=unit(w);if(!groups.has(u))groups.set(u,[]);groups.get(u).push(w.id)}p=db.plans[key]={remaining:keys.flatMap(u=>groups.get(u)),batch:[],round:0,initial:keys.length};}if(cfg.range!=='all'){let existing=new Set(p.remaining);for(let w of scope){if(matches(w,cfg.range)&&!existing.has(w.id)){p.remaining.push(w.id);existing.add(w.id)}}}return {key,p}}

function batchScreen(special){let screen=special?'538':'normal';let prior=db.ui?.[screen]||{};let cats=special?categories.filter(x=>x.startsWith('538')):categories;let sources=special?['538 · 第一类','538 · 第二类','538 · 第三类']:[...new Set(db.words.map(w=>w.source).filter(Boolean))];let opt=(v,l)=>`<option value="${esc(v)}">${esc(l??v)}</option>`;
panel(`<h2>${special?'阅读考点词真经 538':'分类训练'}</h2><p class="muted">${special?'按原书376个主考点排列，20个主考点含对应词义及替换题，不考拼写。':'按分类及来源持续学习，过关后接着练习下一组。'}</p><div class="filters"><label>${special?'训练类型':'词汇分类'}<select id="cat">${opt('',special?'混合':'全部')}${cats.map(x=>opt(x)).join('')}</select></label><label>${special?'原书分类':'剑雅 / 主题'}<select id="src">${opt('','全部')}${sources.map(x=>opt(x)).join('')}</select></label><label>进度<select id="range">${opt('continue','继续学习（未过关）')}${opt('all','全部词汇（按批复练）')}${opt('due','今日到期')}</select></label></div><div class="filters"><label>出题顺序<select id="order">${opt('ordered','原书 / Notion 顺序')}${opt('random','随机')}</select></label><label>每轮目标词数<select id="limit">${[20,50,100,0].map(n=>opt(n,n||'全部')).join('')}</select></label></div><p id="num" class="muted"></p><div class="bar"><div id="batchProgress"></div></div><div class="actions"><button id="start" class="primary">继续训练</button><button id="reset" style="display:none">重新开始全部复练</button></div><p class="note">选择题每次随机排列；本轮过关后继续下一组，旧词进入今日复习。未过关的词不会被跳过。</p>`);
for(let id of ['cat','src','range','order','limit']){if(prior[id]!=null&&[...$('#'+id).options].some(o=>o.value===String(prior[id])))$('#'+id).value=prior[id]}
function cfg(){return {screen,cat:$('#cat').value,src:$('#src').value,range:$('#range').value,order:$('#order').value,limit:+$('#limit').value}}function scope(c){return db.words.filter(w=>(!special||w.cat.startsWith('538'))&&(!c.cat||w.cat===c.cat)&&(!c.src||w.source===c.src))}
function refresh(){let c=cfg(),a=scope(c),p=db.plans?.[planKey(c)],r=c.range==='all'&&p?planRemaining(p,c,a):a.filter(w=>matches(w,c.range));let total=units(a).length,left=units(r).length,known=units(a.filter(w=>!mastered(w))).length;$('#num').textContent=`本范围 ${total} 个词 · 已过关 ${total-known} 个 · 本计划剩余 ${left} 个 · 下一轮 ${Math.min(c.limit||left,left)} 个${p?.round?' · 已完成 '+p.round+' 轮':''}`;$('#batchProgress').style.width=(total?100*(total-known)/total:0)+'%';$('#start').disabled=!left;$('#start').textContent=left?'开始 / 继续下一轮':'本范围已完成';$('#reset').style.display=c.range==='all'&&p?'inline-block':'none';db.ui??={};db.ui[screen]=c;save()}

function status(w){return w.active?'强化 '+w.streak+'/3':w.due? (w.stage>=5?'长期维持':`已过关 · ${w.due}`):'未安排'}function wrongPage(){panel(`<h2>我的错词本</h2><p class="muted">错误累计永久保留。历史错词可以随时单独练习。</p><div class="filters"><label>累计错误次数<select id="min"><option value="0">全部错词（含导入的听力错词）</option><option value="1">≥ 1 次</option><option value="2">≥ 2 次</option><option value="3">≥ 3 次</option><option value="5">≥ 5 次</option><option value="10">≥ 10 次</option></select></label><label>分类<select id="cat"><option value="">全部</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></label><label>复习范围<select id="scope"><option value="all">全部历史错词</option><option value="due">今日到期 / 未过关</option><option value="active">仅未过关</option></select></label></div><button class="primary" id="start">练习筛选后的错词</button><div class="scroll" id="results"></div>`);let get=()=>db.words.filter(w=>(w.errors||w.cat==='听力错词')&&w.errors>=+$('#min').value&&(!$('#cat').value||w.cat===$('#cat').value)&&($('#scope').value==='all'||($('#scope').value==='due'?due(w):w.active))).sort((a,b)=>b.errors-a.errors);let refresh=()=>{let l=get();$('#start').disabled=!l.length;$('#results').innerHTML=`<p class="muted" style="margin-top:12px">${l.length} 个词</p><table><thead><tr><th>词汇</th><th>累计错</th><th>状态</th></tr></thead><tbody>${l.map(w=>`<tr><td><b>${esc(w.word)}</b><br><small>${esc(w.cat)} · ${esc(w.answer)}</small></td><td>${w.errors}</td><td>${esc(status(w))}</td></tr>`).join('')}</tbody></table>`};['min','cat','scope'].forEach(x=>$('#'+x).onchange=refresh);refresh();$('#start').onclick=()=>start(get())}
